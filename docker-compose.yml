# Backend et base de données en conteneurs. L'application Expo tourne sur la machine.
#   docker compose up -d --build
#   API : http://localhost:4000  ·  Swagger : http://localhost:4000/api/docs
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/subtracker
      PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
